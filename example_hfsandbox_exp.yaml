# example_hfsandbox_exp.yaml — run the HF Sandboxes provider end to end.
# Fill in the bucket in configs/environments/hfsandbox.yaml first (see that
# file, or docs/ale-docs-site/pages/hf-sandbox.html), then:
#
#     uv run python -m ale_run run example_hfsandbox_exp.yaml
#     uv run python -m ale_run run example_hfsandbox_exp.yaml --dry-run
#
# See example_exp.yaml for what each field means.

name: hfsandbox_example

secret_file: secret/.env

agents:
  - configs/agents/qwen_code_hf.yaml
environment: configs/environments/hfsandbox.yaml

tasks:
  - path: demo/tool_smoke

output:
  root: .logs/ale
concurrency: 1
auto_resume: true
max_attempts: 1
cleanup_mode: delete
